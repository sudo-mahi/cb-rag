[project]
name = "cb-rag"
version = "0.1.0"
description = "Personal codebase RAG — index every repo you work on, ask questions from the terminal"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.122.0",
    "chromadb>=1.5.9",
    "click>=8.4.2",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "tree-sitter-language-pack>=1.14.3",
    "uvicorn>=0.52.3",
    "watchdog>=6.0.0",
]

[project.scripts]
ragx = "cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "cli"]
